spring.application.name=omie-financeiro
server.port=${PORT:8080}
# H2 em arquivo: dados sobrevivem a reinicializacoes. Nao versionar ./data/.
spring.datasource.url=jdbc:h2:file:./data/financeiro;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${H2_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.importacao.max-registros=20000
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
