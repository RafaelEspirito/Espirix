services:
  caddy_local:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - espirix_caddy_local_data:/data
      - espirix_caddy_local_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  espirix_caddy_local_data:
  espirix_caddy_local_config:
