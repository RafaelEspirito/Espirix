# Included inside the http {} context by official Nginx image.
# Caddy no Docker repassa o IP real no X-Forwarded-For.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=espirix_login:10m rate=5r/m;
server {
  listen 80;
  server_name _;
  client_max_body_size 11m;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  location = /api/auth/login {
    limit_req zone=espirix_login burst=5 nodelay;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 125s;
  }
  location = /actuator/health {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
