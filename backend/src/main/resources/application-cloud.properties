# Somente para PostgreSQL NOVO. Nunca use cloud sobre o banco H2 existente.
# Flyway cria o esquema; Hibernate APENAS valida. Não habilite ddl-auto=update em produção.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:espirix_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.forward-headers-strategy=framework
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.limpeza.permitir-trabalho=false
app.cors.allowed-origins=${CORS_ORIGINS}
# Sem logs de SQL que possam revelar dados financeiros
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
