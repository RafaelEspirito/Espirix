# PERFIL LEGADO DESATIVADO: use --spring.profiles.active=cloud para PostgreSQL limpo.
# Não use a configuração antiga ddl-auto=update em servidor público.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/espirix}
spring.datasource.username=${DB_USER:espirix_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
