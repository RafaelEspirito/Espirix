spring.application.name=espirix
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/espirix-v03;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${H2_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.importacao.max-registros=20000
app.limpeza.permitir-trabalho=${ESPIRIX_PERMITIR_LIMPEZA_TRABALHO:false}
app.seed.master-email=${ESPIRIX_MASTER_EMAIL:}
app.seed.master-password=${ESPIRIX_MASTER_PASSWORD:}
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
