services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ESPIRIX_DOMAIN: ${ESPIRIX_DOMAIN:?Informe ESPIRIX_DOMAIN e ajuste DNS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
