# Base de deploy. Para login, use sempre a sobreposicao publica HTTPS com DNS.
# Para desenvolver localmente, continue usando IntelliJ (H2) e Vite.
# Banco v0.4 separado do H2 de desenvolvimento e de eventuais volumes antigos.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: espirix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Defina DB_ADMIN_PASSWORD}
      ESPIRIX_DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - espirix_pg_v04:/var/lib/postgresql/data
      - ./infra/postgres/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d espirix"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      DB_URL: jdbc:postgresql://db:5432/espirix
      DB_USER: espirix_app
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      ESPIRIX_MASTER_EMAIL: ${ESPIRIX_MASTER_EMAIL:?Defina ESPIRIX_MASTER_EMAIL}
      ESPIRIX_MASTER_PASSWORD: ${ESPIRIX_MASTER_PASSWORD:?Defina ESPIRIX_MASTER_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS}
      ESPIRIX_PERMITIR_LIMPEZA_TRABALHO: "false"
      TZ: America/Bahia
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  espirix_pg_v04:
